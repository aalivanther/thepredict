# ThePredict bench v2: classic 'legal-equal' of kit K4 (sustain).
# Mobs/Bench_K4_legal_equal.yml; the skills of the kit stay in their own file.
Bench_K4_legal_equal:
  Type: ZOMBIE
  Display: 'Classic legal-equal'
  Health: 60
  Damage: 0
  Options:
    FollowRange: 32
    PreventSunburn: true
    Despawn: false
  Modules:
    ThreatTable: false
  AIGoalSelectors:
  - 0 clear
  - 1 fleeConditional{distance=8;speed=1.2;mc=[ - healthpercent{p=<60%} true ]}
  - 4 meleeAttack{speed=1.15}
  Skills:
  - skill{s=Bench_K4_legal_equal_RuleSustainHeal} @self ~onTimer:1
  - skill{s=Bench_K4_legal_equal_RuleSustainGuard} @self ~onTimer:1
  - skill{s=Bench_K4_legal_equal_RuleSustainStrike} @self ~onTimer:1
# Skills/Bench_K4_legal_equalRules.yml
Bench_K4_legal_equal_RuleSustainHeal:
  Conditions:
  - predictorcontrol false
  - healthpercent{p=<60%} true
  Skills:
  - skill{s=SustainHeal} @self
Bench_K4_legal_equal_RuleSustainGuard:
  Conditions:
  - predictorcontrol false
  - healthpercent{p=>30%} true
  Skills:
  - skill{s=SustainGuard} @self
Bench_K4_legal_equal_RuleSustainStrike:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  TargetConditions:
  - hasaura{auraName=Bench_K4_legal_equal_WindowSustainStrike} false
  Skills:
  - skill{s=SustainStrike} @target
  - aura{auraName=Bench_K4_legal_equal_WindowSustainStrike;duration=10} @target
