# ThePredict bench v2: classic 'pack' of kit K3 (burst).
# Mobs/Bench_K3_pack.yml; the skills of the kit stay in their own file.
Bench_K3_pack:
  Type: ZOMBIE
  Display: 'Classic pack'
  Health: 60
  Damage: 0
  Options:
    FollowRange: 32
    PreventSunburn: true
    Despawn: false
  Modules:
    ThreatTable: false
  AIGoalSelectors:
  - 0 clear
  - 4 meleeAttack{speed=1}
  Skills:
  - skill{s=Bench_K3_pack_RuleBurstGuard} @self ~onTimer:20
  - skill{s=Bench_K3_pack_RuleBurstStrike} @self ~onTimer:10
  - skill{s=Bench_K3_pack_RuleBurstLeap} @self ~onTimer:20
# Skills/Bench_K3_packRules.yml
Bench_K3_pack_RuleBurstGuard:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  - healthpercent{p=<60%} true
  Skills:
  - skill{s=BurstGuard} @self
Bench_K3_pack_RuleBurstStrike:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  Skills:
  - skill{s=BurstStrike} @target
Bench_K3_pack_RuleBurstLeap:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=8} true
  - targetwithin{d=4} false
  Skills:
  - skill{s=BurstLeap} @target
