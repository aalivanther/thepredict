# ThePredict bench v2: classic 'pack' of kit K1 (pack).
# Mobs/Bench_K1_pack.yml; the skills of the kit stay in their own file.
Bench_K1_pack:
  Type: ZOMBIE
  Display: 'Classic pack'
  Health: 60
  Damage: 0
  Options:
    FollowRange: 32
    PreventSunburn: true
    Despawn: false
  Modules:
    ThreatTable: false
  AIGoalSelectors:
  - 0 clear
  - 4 meleeAttack{speed=1}
  Skills:
  - skill{s=Bench_K1_pack_RuleDuelHeal} @self ~onTimer:20
  - skill{s=Bench_K1_pack_RuleDuelGuard} @self ~onTimer:20
  - skill{s=Bench_K1_pack_RuleDuelStrike} @self ~onTimer:10
  - skill{s=Bench_K1_pack_RuleDuelLeap} @self ~onTimer:20
  - skill{s=Bench_K1_pack_RuleDuelBolt} @self ~onTimer:20
# Skills/Bench_K1_packRules.yml
Bench_K1_pack_RuleDuelHeal:
  Conditions:
  - predictorcontrol false
  - healthpercent{p=<50%} true
  Skills:
  - skill{s=DuelHeal} @self
Bench_K1_pack_RuleDuelGuard:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  - healthpercent{p=<60%} true
  Skills:
  - skill{s=DuelGuard} @self
Bench_K1_pack_RuleDuelStrike:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  Skills:
  - skill{s=DuelStrike} @target
Bench_K1_pack_RuleDuelLeap:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=8} true
  - targetwithin{d=4} false
  Skills:
  - skill{s=DuelLeap} @target
Bench_K1_pack_RuleDuelBolt:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=14} true
  - targetwithin{d=4} false
  Skills:
  - skill{s=DuelBolt} @target
