# ThePredict bench v2: classic 'pack' of kit K4 (sustain).
# Mobs/Bench_K4_pack.yml; the skills of the kit stay in their own file.
Bench_K4_pack:
  Type: ZOMBIE
  Display: 'Classic pack'
  Health: 60
  Damage: 0
  Options:
    FollowRange: 32
    PreventSunburn: true
    Despawn: false
  Modules:
    ThreatTable: false
  AIGoalSelectors:
  - 0 clear
  - 4 meleeAttack{speed=1}
  Skills:
  - skill{s=Bench_K4_pack_RuleSustainHeal} @self ~onTimer:20
  - skill{s=Bench_K4_pack_RuleSustainGuard} @self ~onTimer:20
  - skill{s=Bench_K4_pack_RuleSustainStrike} @self ~onTimer:10
# Skills/Bench_K4_packRules.yml
Bench_K4_pack_RuleSustainHeal:
  Conditions:
  - predictorcontrol false
  - healthpercent{p=<60%} true
  Skills:
  - skill{s=SustainHeal} @self
Bench_K4_pack_RuleSustainGuard:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  - healthpercent{p=<60%} true
  Skills:
  - skill{s=SustainGuard} @self
Bench_K4_pack_RuleSustainStrike:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  Skills:
  - skill{s=SustainStrike} @target
