# ThePredict bench v2: classic 'legal-equal' of kit K2 (ranged).
# Mobs/Bench_K2_legal_equal.yml; the skills of the kit stay in their own file.
Bench_K2_legal_equal:
  Type: ZOMBIE
  Display: 'Classic legal-equal'
  Health: 60
  Damage: 0
  Options:
    FollowRange: 32
    PreventSunburn: true
    Despawn: false
  Modules:
    ThreatTable: false
  AIGoalSelectors:
  - 0 clear
  - 2 fleeConditional{distance=5;speed=1.15;mc=[ - skillOnCooldown{s=RangedStrike} true ]}
  - 3 moveWithinConditional{range=9;speed=1.15;mc=[ - skillOnCooldown{s=RangedStrike} true ]}
  - 4 meleeAttackConditional{speed=1.15;mc=[ - skillOnCooldown{s=RangedStrike} false ]}
  Skills:
  - skill{s=Bench_K2_legal_equal_RuleRangedGuard} @self ~onTimer:1
  - skill{s=Bench_K2_legal_equal_RuleRangedStrike} @self ~onTimer:1
  - skill{s=Bench_K2_legal_equal_RuleRangedBolt} @self ~onTimer:1
# Skills/Bench_K2_legal_equalRules.yml
Bench_K2_legal_equal_RuleRangedGuard:
  Conditions:
  - predictorcontrol false
  - healthpercent{p=>30%} true
  Skills:
  - skill{s=RangedGuard} @self
Bench_K2_legal_equal_RuleRangedStrike:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  TargetConditions:
  - hasaura{auraName=Bench_K2_legal_equal_WindowRangedStrike} false
  Skills:
  - skill{s=RangedStrike} @target
  - aura{auraName=Bench_K2_legal_equal_WindowRangedStrike;duration=10} @target
  - aura{auraName=Bench_K2_legal_equal_WindowRangedBolt;duration=5} @target
Bench_K2_legal_equal_RuleRangedBolt:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=16} true
  TargetConditions:
  - hasaura{auraName=Bench_K2_legal_equal_WindowRangedBolt} false
  Skills:
  - skill{s=RangedBolt} @target
  - aura{auraName=Bench_K2_legal_equal_WindowRangedStrike;duration=15} @target
  - aura{auraName=Bench_K2_legal_equal_WindowRangedBolt;duration=10} @target
