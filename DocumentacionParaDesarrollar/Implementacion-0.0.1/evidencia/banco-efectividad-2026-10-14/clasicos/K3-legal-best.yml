# ThePredict bench v2: classic 'legal-best' of kit K3 (burst).
# Mobs/Bench_K3_legal_best.yml; the skills of the kit stay in their own file.
Bench_K3_legal_best:
  Type: ZOMBIE
  Display: 'Classic legal-best'
  Health: 60
  Damage: 0
  Options:
    FollowRange: 32
    PreventSunburn: true
    Despawn: false
  Modules:
    ThreatTable: false
  AIGoalSelectors:
  - 0 clear
  - 4 meleeAttack{speed=1.2}
  Skills:
  - skill{s=Bench_K3_legal_best_RuleBurstGuard} @self ~onTimer:1
  - skill{s=Bench_K3_legal_best_RuleBurstStrike} @self ~onTimer:1
  - skill{s=Bench_K3_legal_best_RuleBurstLeap} @self ~onTimer:1
# Skills/Bench_K3_legal_bestRules.yml
Bench_K3_legal_best_RuleBurstGuard:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  Skills:
  - skill{s=BurstGuard} @self
Bench_K3_legal_best_RuleBurstStrike:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=3} true
  TargetConditions:
  - hasaura{auraName=Bench_K3_legal_best_WindowBurstStrike} false
  Skills:
  - skill{s=BurstStrike} @target
  - aura{auraName=Bench_K3_legal_best_WindowBurstStrike;duration=10} @target
  - aura{auraName=Bench_K3_legal_best_WindowBurstLeap;duration=8} @target
Bench_K3_legal_best_RuleBurstLeap:
  Conditions:
  - predictorcontrol false
  - targetwithin{d=8} true
  TargetConditions:
  - hasaura{auraName=Bench_K3_legal_best_WindowBurstLeap} false
  Skills:
  - skill{s=BurstLeap} @target
  - aura{auraName=Bench_K3_legal_best_WindowBurstStrike;duration=12} @target
  - aura{auraName=Bench_K3_legal_best_WindowBurstLeap;duration=10} @target
