schemaVersion: 2
duel_red:
  MythicID: DuelRed
  TypeOfMythicID: MOB
  Type: NORMAL
  Objective: Defeat the rival duelist and survive
  Participants:
    PlayerGameModes: []
    Entities:
      Allow: ['faction:duel_blue']
  Choices:
    strike:
      MythicID: DuelStrike
      TypeOfMythicID: SKILL
      Purpose:
        Roles: [DAMAGE]
        Delivery: MELEE
        Reach: 2.5
        WindUp: 5
        Damage: MEDIUM
        BestWhen: [TARGET_IN_MELEE]
    bolt:
      MythicID: DuelBolt
      TypeOfMythicID: SKILL
      Purpose:
        Roles: [DAMAGE]
        Delivery: HITSCAN
        Reach: 14
        WindUp: 10
        Damage: LOW
        BestWhen: [TARGET_AT_RANGE]
        Risks: [NEEDS_LINE_OF_SIGHT]
    leap:
      MythicID: DuelLeap
      TypeOfMythicID: SKILL
      Purpose:
        Roles: [GAP_CLOSE, DAMAGE]
        Delivery: HITSCAN
        Reach: 8
        WindUp: 10
        Damage: LOW
        BestWhen: [TARGET_FLEEING, TARGET_AT_RANGE]
    guard:
      MythicID: DuelGuard
      TypeOfMythicID: SKILL
      RequiresTarget: false
      Purpose:
        Roles: [DEFENSE]
        Delivery: SELF
        Damage: NONE
        BestWhen: [TARGET_IN_MELEE]
    heal:
      MythicID: DuelHeal
      TypeOfMythicID: SKILL
      RequiresTarget: false
      Purpose:
        Roles: [SUSTAIN]
        Delivery: SELF
        Damage: NONE
        BestWhen: [SELF_LOW_HEALTH]
  Tactics:
    press_and_strike: { Movement: APPROACH, Choice: strike, Priority: 70 }
    keep_distance_and_bolt: { Movement: KEEP_DISTANCE, Choice: bolt, Priority: 60 }
    leap_in: { Movement: APPROACH, Choice: leap, Priority: 55 }
    guard_up: { Movement: HOLD, Choice: guard, Priority: 50 }
    retreat_and_heal: { Movement: RETREAT, Choice: heal, Priority: 80 }
    approach: { Movement: APPROACH, Priority: 10 }
  Contexts:
    low_health_phase: { Priority: 90, Tactics: [retreat_and_heal, keep_distance_and_bolt] }
    healthy:
      Priority: 80
      Conditions: ['healthpercent{p=>50%} true']
      Tactics: [press_and_strike, keep_distance_and_bolt, leap_in, guard_up, approach]
  Movement:
    Band: { Inner: 5, Outer: 9 }
    RangedReach: 14
    Retreat: { Distance: 8, Speed: 1.2 }
    Arena: { Radius: 18 }
  Timing:
    TickLayer: casts
    Cadence: standard
