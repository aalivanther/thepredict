# Sesión 25. Ejemplos de grupo. No ejecutados en un servidor.
# group.mode global sigue en fair. Un perfil no puede subir el modo.
schemaVersion: 2
jefe_invocador:
  MythicID: JefeInvocador
  TypeOfMythicID: MOB
  Type: NORMAL
  Objective: Survive while the summoned squad presses the current target
  Group:
    Mode: fair
    Squad: summoners
    LeaderPriority: 80
    Weight: 2
    OnLeaderDeath: break
    AgainstEntities: free
    Questions: members
    PlanQuestion: on_change
  Choices:
    melee:
      MythicID: JefeInvocadorMelee
      TypeOfMythicID: SKILL
  Tactics:
    press:
      Movement: APPROACH
      Choice: melee
      Priority: 70
