# Sesión 25. No ejecutado en un servidor. Las skills de las choices de Grupos.yml.
# ThePredict las lanza con su propio disparador; los mobs no las lanzan con un disparador normal.
# La cura del trío alcanza a los otros hechiceros (@MobsInRadius); la choice declara TargetsAllies: true.
JefeInvocadorMelee:
  Intention: DAMAGE, MELEE, DAMAGE_MEDIUM, WHEN_TARGET_IN_MELEE
  Cooldown: 2
  Conditions:
  - targetwithin{d=4} true
  Skills:
  - damage{a=6} @target

Patrulla5Melee:
  Intention: DAMAGE, MELEE, DAMAGE_LOW, WHEN_TARGET_IN_MELEE
  Cooldown: 2
  Conditions:
  - targetwithin{d=4} true
  Skills:
  - damage{a=3} @target

TrioHechicerosHeal:
  Intention: SUSTAIN, AREA_AROUND_SELF
  Cooldown: 8
  Skills:
  - heal{a=6} @MobsInRadius{r=16;types=TrioHechiceros}

TrioHechicerosBolt:
  Intention: DAMAGE, HITSCAN, DAMAGE_LOW, WHEN_TARGET_AT_RANGE, RISK_NEEDS_LINE_OF_SIGHT
  Cooldown: 3
  Conditions:
  - targetwithin{d=16} true
  TargetConditions:
  - lineofsight true
  Skills:
  - damage{a=3} @target
