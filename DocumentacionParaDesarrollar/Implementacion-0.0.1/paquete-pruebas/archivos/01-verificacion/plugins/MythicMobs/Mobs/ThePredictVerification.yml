# ThePredict 0.0.1 verification pack (M01 server script, section 1.4). Every mob has Despawn: false so it
# survives chunk unloads and restarts; kill leftovers with /kill @e[type=!minecraft:player] between sessions.
TPV_Zombie:
  Type: ZOMBIE
  Display: 'TPV Zombie'
  Health: 200
  Damage: 2
  Predictor: true
  Options:
    FollowRange: 32
    PreventOtherDrops: true
    Despawn: false
  Skills:
  - skill{s=TPV_ShowIntent} @self ~onTimer:100
  - skill{s=TPV_DecideMechanic} @self ~onTimer:20
  - skill{s=TPV_CaseLower} @self ~onTimer:100
  - skill{s=TPV_CaseMixed} @self ~onTimer:100
  - skill{s=TPV_CaseUpper} @self ~onTimer:100
  - skill{s=TPV_SignalUpper} @self ~onSignal:PREDICTOR_HOLD
  - skill{s=TPV_SignalLower} @self ~onSignal:predictor_hold

TPV_ZombiePlain:
  Type: ZOMBIE
  Display: 'TPV Zombie Plain'
  Health: 200
  Damage: 2
  Predictor: false
  Options:
