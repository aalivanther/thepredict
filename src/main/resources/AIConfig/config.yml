# ThePredict 0.0.1 configuration, schema 2.
# Every value below is the default. Units are in the key names: Millis, Ticks, Blocks, Micros.
schemaVersion: 2
jev:
  # TypeSafe Jev endpoint. https is required; http is accepted only for localhost.
  baseUrl: 'https://api.typesafe.ai'
  # Versioned Jev model tested with this release.
  model: 'jev-1.13.0'
  # This environment variable wins over apiKey. Keep the key out of this file when you can.
  apiKeyEnvironment: 'TYPESAFE_API_KEY'
  apiKey: ''
  # typesafe reads TYPESAFE_API_KEY. kev is local, ignores this key, and requires a loopback baseUrl.
  provider: typesafe
  timeoutMillis: 800
  connectTimeoutMillis: 1500
  maxResponseBytes: 262144
  # Largest encoded combat state sent to Jev, 2000 to 45000 characters (the request guard allows 48000 with the
  # longest question). Calibrated for English text.
  maxStateChars: 12000
decision:
  # Global limits. A profile can never widen them.
  maxRequestsPerMinute: 600
  maxRequestsPerMinutePerWorld: 300
  maxInFlightRequests: 8
  maxInFlightRequestsPerWorld: 4
  maxInputTokensPerMinute: 600000
  encounterHeartbeatTicks: 20
  contingenciesPerMob: 1
  minimumConfidence: 0.45
  tacticSwitchMargin: 0.15
  maxInstallsPerTick: 10
  maxEncounterEvaluationsPerTick: 2
  maxProbesPerTick: 64
  maxCompletionsPerTick: 16
  maxSignalsPerTick: 64
  maxTickWorkMicros: 2000
  # maxDecisionAgeMillis is omitted: it defaults to jev.timeoutMillis + 200 (at most 5000).
  lowConfidenceStreakForLocal: 3
  searchRadiusBlocks: 48.0
  logDecisions: false
  # Questions to Jev (M16). maxOptionsPerQuestion caps the options of one question after identical tactics are merged
  # (2 to 32). questionDetail is how much each option says: full (default since the M16.10 re-bench), standard or
  # compact (cheapest); a profile may choose its own with Timing.QuestionDetail, and no detail widens the token limits
  # above.
  maxOptionsPerQuestion: 8
  questionDetail: full
  # Optional fit check per option, only sent with questionDetail full; fitChecksAllowed: false forbids it everywhere.
  fitChecks: false
  fitChecksAllowed: true
  fitVeto: 0.2
  fitRescue: 0.7
  # Which skills fire as soon as they are ready: any_ready (default) or intent_only (only the choice of the tactic).
  # A profile may set Timing.CastMode to intent_only to opt out. The thread of a cast is global: same_tick runs the
  # skill's delay on the server thread; mythic_default keeps the 0.0.1 metadata.
  castMode: any_ready
  castThread: same_tick
  # A skill with no Purpose and no valid Intention fires only as the choice of its tactic.
  untypedCast: tactic_only
  # Ticks ahead a skill still counts as available for the question. 0 keeps today's eligible set. The local planner
  # never reads it. 0 to 100.
  readyHorizonTicks: 0
  # off keeps today's question order. safe drops options that cannot work and orders the rest by the local score.
  pruning: "off"
  # casts, reactions (default) or full. off is an error: removed; use casts.
  tickLayer:
    mode: reactions
    maxSessionsPerTick: 96
    maxMicros: 600
    guardMspt: 0
    microMinHoldTicks: 4
    waypointRefreshTicks: 5
    maxWaypointPathsPerTick: 8
    maxWaypointPathMicrosPerTick: 400
  # priority (default), utility or learned. learned acts only with an active artifact.
  candidateScoring: priority
  # raw (default) or calibrated. parity keeps the same accepts as raw 0.45.
  confidenceGate: raw
  minimumCalibratedConfidence: parity
  candidateDiversity: false
  # off (default), shadow or on. on reuses an exact answer only after the M21.7 gate, which this release does not cross.
  answerCache: "off"
  answerCacheTtlTicks: 100
  answerCacheEntries: 2048
  answerCacheRevalidateRatio: 0.1
debug:
  # Records decisions as anonymized scenarios for the test suite. Keep it off on a live server.
  recordScenarios: false
  # Base seed of StableRandom. 0 is the default installation.
  seed: 0
profileDefaults:
  # Inherited by every profile unless the profile overrides the value.
  observationIntervalTicks: 2
  minimumDecisionIntervalTicks: 20
  maximumIntentDurationTicks: 40
  criticalHealthRatio: 0.3
  woundedHealthRatio: 0.6
  meleeReachBlocks: 2.5
  bandInnerBlocks: 5.0
  bandOuterBlocks: 9.0
  rangedReachBlocks: 16.0
  retreatDistanceBlocks: 10.0
  retreatSpeed: 1.2
  approachSpeed: 1.15
participants:
  # Players in these game modes can be perceived, targeted and fought.
  playerGameModes: [SURVIVAL, ADVENTURE]
  entities:
    # Selectors of non-player living entities that can take part. Empty: none (0.0.1 behavior).
    allow: []
    # Selectors that never take part, even if a profile allows them.
    deny: []
    # Whether profiles may add entity selectors of their own.
    profilesMayAllow: true
    # Whether entities other than the mobs' targets are perceived (one nearby-entity query per member).
    perceiveNonTargets: false
    # Most non-target entities kept per member and capture when perceiveNonTargets is true (1 to 16).
    maxCandidatesPerMember: 8
records:
  # off, decisions (default) or full. full also writes casts, threat, reactions and micro.
  level: decisions
  # none, hash (default), dedup or all.
  bodies: hash
  # Relative to the plugin folder. Rejects .. and an absolute path.
  directory: records
  queueCapacity: 16384
  segmentMegabytes: 64
  segmentMinutes: 60
  compressClosedSegments: true
  retentionDays: 14
  maxTotalMegabytes: 2048
  patternSummaryBinary: false
difficulty:
  # auto plays the controller against players and full power against entities. bench is full power. player always
  # aims the whole fight at the target time.
  defaultMode: auto
  defaultPreset: normal
  adjustIntervalTicks: 100
  toleranceRatio: 0.20
  deadbandRatio: 0.10
  learningGain: 0.25
  projectedTtkCapRatio: 4
  dampingReversals: 4
  estimatorHalfLifeTicks: 100
  minEvidenceTicks: 60
  disengageTicks: 200
  maxTrackedFights: 4
  nativeLevelAllowed: false
  presets:
    facil:
      targetMinutes: 45
      reactionFloorTicks: 5
      entropyReactionFloorTicks: 4
      entropyAdaptStartSeconds: 7
    normal:
      targetMinutes: 30
      reactionFloorTicks: 5
      entropyReactionFloorTicks: 3
      entropyAdaptStartSeconds: 5
    dificil:
      targetMinutes: 15
      reactionFloorTicks: 3
      entropyReactionFloorTicks: 0
      entropyAdaptStartSeconds: 3.5
    caos:
      targetMinutes: 10
      reactionFloorTicks: 1
      entropyReactionFloorTicks: 0
      entropyAdaptStartSeconds: 1.5
    vacio:
      targetMinutes: 5
      reactionFloorTicks: 0
      entropyReactionFloorTicks: 0
      entropyAdaptStartSeconds: 0
storage:
  # off or sqlite. mysql is reserved and rejected.
  aggregates: sqlite
  # File name beside the records folder, not inside it.
  file: aggregates.db
  synchronous: normal
  busyTimeoutMillis: 2000
  flushIntervalTicks: 100
  maxPendingKeys: 4096
  backupEveryHours: 24
  backupsKept: 7
